name: Android release

on:
  push:
    tags:
      - "v*"
  # Manual run from the Actions tab. With release_tag set it publishes a release and
  # creates that tag on the commit it built; left empty it is a test build whose APK
  # is kept as a workflow artifact.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v1.0.1 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' should look like v1.0.0"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      # The model is ~86 MiB in Git LFS. Cache the LFS objects so repeat releases
      # don't spend LFS bandwidth downloading the same file again.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}

      - name: Pull LFS files
        run: git lfs pull

      - name: Check the model is present
        run: |
          model=app/src/main/assets/chilivision_inceptionv3.tflite
          size=$(stat -c %s "$model" 2>/dev/null || echo 0)
          if [ "$size" -ge 1000000 ]; then
            echo "Model OK: $size bytes"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::$model is missing or only an LFS pointer ($size bytes). Add it with Git LFS before publishing a release."
            exit 1
          else
            echo "::warning::$model is missing or only an LFS pointer ($size bytes). This test build cannot classify images."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 4 ]; then
            # No signing secrets yet: sign with a key made for this run only, so the APK
            # still installs. A later release signed with a different key cannot be
            # installed over this one without uninstalling it first.
            echo "::warning::No signing secrets are set, so this APK is signed with a temporary key (see README > Releases)."
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            KEY_ALIAS=capsibus
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/temporary.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Capsibus temporary CI key"
            KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/temporary.jks")
            export KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            echo "TEMP_KEY=true" >> "$GITHUB_ENV"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Signing secrets missing: ${missing[*]}. Set all four, or none to use a temporary key."
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          ls -l "$apk"

      - name: Upload APK as workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: capsibus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          apk="Capsibus-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "Offline chili leaf disease detection. Download **$apk** on an Android phone (Android 7.0 or newer) and open it to install."
            if [ "$TEMP_KEY" = "true" ]; then
              echo
              echo "This build is signed with a temporary key. To install a later version, uninstall this one first."
            fi
          } > release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            # Creates the tag on the built commit if it doesn't exist yet (manual runs)
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "Capsibus $TAG" --notes-file release-notes.md
          fi
